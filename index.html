<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />

</head>

<body>

    <header>
        <div class="logo">
            <div class="logo__image">
                <img src="images/logo.png" class="logo__img" alt="logo">
            </div>
        </div>
        <div class="menu">
            <ul class="menu__list">
                <li class="menu__item">
                    <a href="index.html" class="menu__link active">home</a>
                </li>
                <li class="menu__item">
                    <a href="about.html" class="menu__link">about</a>
                </li>
                <li class="menu__item">
                    <a href="shop.html" class="menu__link">shop</a>
                </li>
                <li class="menu__item">
                    <a href="contact.html" class="menu__link">contact</a>
                </li>

            </ul>
        </div>
        <div class="icon">
            <ul class="icon__list">
                <li class="icon__item">
                    <a href="#" class="icon__link"><i class="fa fa-bars"></i></a>
                </li>
                <li class="icon__item">
                    <a href="#" class="icon__link"><i class="fa fa-user"></i></a>
                </li>
                <li class="icon__item">
                    <a href="#" class="icon__link"><i class="fa fa-heart"></i></a>
                </li>
                <li class="icon__item">
                    <a href="#" class="icon__link"><i class="fa fa-shopping-cart"></i></a>
                </li>


            </ul>
        </div>
    </header>
    <main>
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <div class="slide__image">
                        <img src="images/watch(1).png" class="slide__img">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="slide__image">
                        <img src="images/watch(2).png" class="slide__img">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="slide__image">
                        <img src="images/watch(3).png" class="slide__img">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="slide__image">
                        <img src="images/watch(4).png" class="slide__img">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="slide__image">
                        <img src="images/watch(5).png" class="slide__img">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="slide__image">
                        <img src="images/watch(6).png" class="slide__img">
                    </div>
                </div>

            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>

        </div>
    </main>
    <footer>
        <div class="footer__box">
            <h3 class="footer__title">quick links</h3>
            <ul class="footer__list">
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>home</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>about</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>shop</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>contact</a>
                </li>

            </ul>
        </div>
        <div class="footer__box">
            <h3 class="footer__title">legal</h3>
            <ul class="footer__list">
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>FAQ</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>terms & conditions</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>privacy and policy</a>
                </li>


            </ul>
        </div>
        <div class="footer__box">
            <h3 class="footer__title">account</h3>
            <ul class="footer__list">
                <li class="footer__item">
                    <a href="login.html" class="footer__link"><i class="fa fa-chevron-right"></i>login</a>
                </li>
                <li class="footer__item">
                    <a href="register.html" class="footer__link"><i class="fa fa-chevron-right"></i>register</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link"><i class="fa fa-chevron-right"></i>my account</a>
                </li>


            </ul>
        </div>
        <div class="footer__box">
            <h3 class="footer__title">Follow us</h3>
            <ul class="footer__list social">
                <li class="footer__item">
                    <a href="#" class="footer__link facebook"><i class="fab fa-facebook"></i></a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link youtube"><i class="fab fa-youtube"></i></a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link telegram"><i class="fab fa-telegram"></i></a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link viber"><i class="fab fa-viber"></i></a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link twitter"><i class="fab fa-twitter"></i></a>
                </li>

            </ul>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper('.mySwiper', {
            slidesPerView: 3,
            spaceBetween: 30,
            centeredSlides: true,
            autoplay: {
                delay: 2500,
                disableOnInteraction: false,
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },

            breakpoints: {
                426: {
                    slidesPerView: 1,
                    spaceBetween: 20,
                },
                768: {
                    slidesPerView: 3,
                    spaceBetween: 40,
                },
                1024: {
                    slidesPerView: 3,
                    spaceBetween: 50,
                },
            },
        });
    </script>
</body>

</html>
